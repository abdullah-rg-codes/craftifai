name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

  security:
    name: security-sast-sca
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy filesystem (CRITICAL/HIGH library CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: node_modules,.git,backups

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Semgrep SAST (OWASP, CWE, Node, TypeScript, secrets, Docker, Actions)
        run: |
          python3 -m pip install --disable-pip-version-check 'semgrep==1.175.0'
          semgrep scan --metrics off --error --severity ERROR \
            --config p/owasp-top-ten \
            --config p/cwe-top-25 \
            --config p/nodejs \
            --config p/typescript \
            --config p/javascript \
            --config p/secrets \
            --config p/security-audit \
            --config p/docker \
            --config p/nginx \
            --config p/github-actions

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Dependency advisory audit (high and critical)
        run: pnpm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: craftifai
          POSTGRES_PASSWORD: craftifai
          POSTGRES_DB: craftifai
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_ADMIN_URL: postgres://craftifai:craftifai@localhost:5432/craftifai?sslmode=disable
      DATABASE_URL: postgres://craftifai_app:craftifai_test@localhost:5432/craftifai?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-session-secret-not-real
      WEBHOOK_SECRET: ci-webhook-secret-not-real
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Derive 32-byte test encryption key
        run: echo "ENCRYPTION_KEY_BASE64=$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w 0)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: >-
          psql "$DATABASE_ADMIN_URL" --set ON_ERROR_STOP=1
          --command "CREATE ROLE craftifai_app LOGIN PASSWORD 'craftifai_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - run: pnpm db:migrate
      - name: Sanity — isolated rules, web, SSRF, crypto
        run: pnpm test:sanity
      - name: Intermediate — PostgreSQL tenant, credits, gateway
        run: pnpm test:intermediate

  compose-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-not-real
      POSTGRES_APP_PASSWORD: ci-app-password-not-real
      SESSION_SECRET: ci-session-secret-not-real
      WEBHOOK_SECRET: ci-webhook-secret-not-real
      MOCK_MODEL_API_KEY: test-model-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Derive 32-byte test encryption key
        run: echo "ENCRYPTION_KEY_BASE64=$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w 0)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Poison host web node_modules (Windows clone overlay)
        run: |
          rm -rf apps/web/node_modules
          mkdir -p apps/web/node_modules/typescript/bin
          printf '%s\n' '#!/usr/bin/env node' "throw new Error('host node_modules leaked into Docker context')" > apps/web/node_modules/typescript/bin/tsc
          chmod +x apps/web/node_modules/typescript/bin/tsc
      - run: docker compose build

  compose-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      POSTGRES_ADMIN_USER: craftifai_owner
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-not-real
      POSTGRES_APP_PASSWORD: ci-app-password-not-real
      POSTGRES_DB: craftifai
      SESSION_SECRET: ci-session-secret-not-real
      WEBHOOK_SECRET: ci-webhook-secret-not-real
      MOCK_MODEL_API_KEY: test-model-secret
      COOKIE_SECURE: 'false'
      DATABASE_ADMIN_URL: postgres://craftifai_owner:ci-admin-password-not-real@localhost:5432/craftifai?sslmode=disable
      DATABASE_URL: postgres://craftifai_app:ci-app-password-not-real@localhost:5432/craftifai?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_BASE_URL: http://127.0.0.1/api
      MOCK_MODEL_URL: http://mock-model:8081
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Derive 32-byte test encryption key
        run: echo "ENCRYPTION_KEY_BASE64=$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w 0)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up --build -d postgres redis mock-model
      - run: docker compose up --build migrate
      - run: docker compose up --build -d --wait --wait-timeout 180 proxy
      - name: Frontend build has no CDN or font URLs
        run: docker compose exec -T proxy sh -c '! grep -RInE "googleapis|gstatic|jsdelivr|unpkg|cloudflare" /usr/share/nginx/html'
      - run: pnpm test:compose
      - run: bash deploy/test-restore.sh
      - if: always()
        run: docker compose down -v
      - name: Offline overlay — no internet, mock model still reachable
        run: |
          docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d postgres redis mock-model
          docker compose -f docker-compose.yml -f docker-compose.offline.yml up migrate
          docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d --wait --wait-timeout 180 api-1 api-2
          docker compose exec -T api-1 node -e "fetch('http://mock-model:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker compose exec -T api-1 node -e "fetch('https://example.com',{signal:AbortSignal.timeout(3000)}).then(()=>process.exit(1)).catch(()=>process.exit(0))"
          docker compose down -v

  compose-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      POSTGRES_ADMIN_USER: craftifai_owner
      POSTGRES_ADMIN_PASSWORD: ci-admin-password-not-real
      POSTGRES_APP_PASSWORD: ci-app-password-not-real
      POSTGRES_DB: craftifai
      SESSION_SECRET: ci-session-secret-not-real
      WEBHOOK_SECRET: ci-webhook-secret-not-real
      MOCK_MODEL_API_KEY: test-model-secret
      COOKIE_SECURE: 'false'
      DATABASE_ADMIN_URL: postgres://craftifai_owner:ci-admin-password-not-real@localhost:5432/craftifai?sslmode=disable
      DATABASE_URL: postgres://craftifai_app:ci-app-password-not-real@localhost:5432/craftifai?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      TEST_BASE_URL: http://127.0.0.1/api
      MOCK_MODEL_URL: http://mock-model:8081
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Derive 32-byte test encryption key
        run: echo "ENCRYPTION_KEY_BASE64=$(printf '%s' '0123456789abcdef0123456789abcdef' | base64 -w 0)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up --build -d postgres redis mock-model
      - run: docker compose up --build migrate
      - run: docker compose up --build -d --wait --wait-timeout 180 proxy
      - run: pnpm load:test
      - if: always()
        run: docker compose down -v
